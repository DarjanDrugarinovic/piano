<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1b3a">
<title>Little Piano</title>
<style>
  :root {
    --bg: #1e1b3a;
    --panel: #2b2752;
    --text: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* Song picker */
  #songs {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: max(10px, env(safe-area-inset-top)) 12px 10px;
  }
  .song {
    font-size: clamp(28px, 6vmin, 48px);
    width: clamp(56px, 12vmin, 92px); height: clamp(56px, 12vmin, 92px);
    border-radius: 22px; border: 4px solid transparent;
    background: var(--panel); color: inherit; cursor: pointer;
    display: grid; place-items: center; padding: 0;
    transition: transform .15s, border-color .15s;
  }
  .song.active { border-color: #ffd84d; transform: scale(1.08); }

  /* Progress dots */
  #progress {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    min-height: 22px; padding: 0 12px 8px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #ffffff22; transition: background .2s, transform .2s; }
  .dot.done { transform: scale(.8); }
  .dot.next { transform: scale(1.35); box-shadow: 0 0 0 3px #ffffff55; }

  /* Keyboard */
  #piano {
    flex: 1; display: flex; gap: 8px;
    padding: 30px 10px max(12px, env(safe-area-inset-bottom));
    min-height: 0;
  }
  .key {
    position: relative; flex: 1; border-radius: 18px 18px 26px 26px;
    background: #f7f5ff; cursor: pointer;
    box-shadow: inset 0 -14px 0 #d9d4f0, 0 6px 0 #0005;
    transition: transform .08s, filter .2s, opacity .2s, box-shadow .2s;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 22px;
  }
  .key .blob {
    width: 62%; aspect-ratio: 1; border-radius: 50%;
    background: var(--c); box-shadow: 0 4px 0 #0002;
    transition: transform .2s;
  }
  .key.pressed { transform: translateY(5px); box-shadow: inset 0 -8px 0 #d9d4f0, 0 1px 0 #0005; }
  .key.pressed .blob { transform: scale(1.25); }

  /* While a song plays, the key to press is lit and the others fade back */
  body.song-mode .key { opacity: .45; filter: saturate(.5); }
  body.song-mode .key.target {
    opacity: 1; filter: none;
    background: var(--c);
    box-shadow: inset 0 -14px 0 #0003, 0 0 0 6px #fff, 0 0 40px 12px var(--c);
    animation: glow 1s ease-in-out infinite;
  }
  body.song-mode .key.target .blob { background: #fff; }
  body.song-mode .key.target::before {
    content: "👇"; position: absolute; top: -34px; left: 50%;
    font-size: clamp(26px, 6vmin, 44px);
    transform: translateX(-50%);
    animation: bounce .6s ease-in-out infinite alternate;
  }
  @keyframes glow { 50% { transform: translateY(-6px) scale(1.03); } }
  @keyframes bounce { to { transform: translate(-50%, -10px); } }

  /* Flying stars after a right key, confetti at the end */
  .spark {
    position: fixed; pointer-events: none; font-size: 34px;
    animation: fly 0.9s ease-out forwards;
  }
  @keyframes fly {
    from { transform: translate(-50%, -50%) scale(.6); opacity: 1; }
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot)); opacity: 0; }
  }
  #party {
    position: fixed; inset: 0; display: none; place-items: center;
    font-size: 30vmin; pointer-events: none;
  }
  #party.show { display: grid; animation: pop .6s ease-out; }
  @keyframes pop { from { transform: scale(.2) rotate(-30deg); } to { transform: scale(1); } }

  /* Tap to start (browsers need a tap before sound) */
  #start {
    position: fixed; inset: 0; background: var(--bg);
    display: grid; place-items: center; cursor: pointer; z-index: 10;
  }
  #start span {
    font-size: 26vmin; animation: glow 1.2s ease-in-out infinite;
  }
</style>
</head>
<body>
  <div id="songs"></div>
  <div id="progress"></div>
  <div id="piano"></div>
  <div id="party">🎉</div>
  <div id="start"><span>🎹</span></div>

<script>
// One octave, C4 to C5: white keys only, big and colorful for small hands.
const KEYS = [
  { note: "C",  freq: 261.63, color: "#ff4d4d" },
  { note: "D",  freq: 293.66, color: "#ff9a2e" },
  { note: "E",  freq: 329.63, color: "#ffd61f" },
  { note: "F",  freq: 349.23, color: "#3ccf5a" },
  { note: "G",  freq: 392.00, color: "#2fb8ff" },
  { note: "A",  freq: 440.00, color: "#4d6bff" },
  { note: "B",  freq: 493.88, color: "#a259ff" },
  { note: "C2", freq: 523.25, color: "#ff5fb4" },
];

// Songs that fit in one octave. Each number is a key index (0 = C ... 7 = high C).
const C = 0, D = 1, E = 2, F = 3, G = 4, A = 5, B = 6, C2 = 7;
const SONGS = [
  { icon: "🎹", name: "Free play", notes: [] },
  { icon: "⭐", name: "Twinkle Twinkle Little Star", notes: [
    C,C,G,G,A,A,G, F,F,E,E,D,D,C,
    G,G,F,F,E,E,D, G,G,F,F,E,E,D,
    C,C,G,G,A,A,G, F,F,E,E,D,D,C ] },
  { icon: "🐑", name: "Mary Had a Little Lamb", notes: [
    E,D,C,D,E,E,E, D,D,D, E,G,G,
    E,D,C,D,E,E,E, E,D,D,E,D,C ] },
  { icon: "🥐", name: "Hot Cross Buns", notes: [
    E,D,C, E,D,C, C,C,C,C, D,D,D,D, E,D,C ] },
  { icon: "🚣", name: "Row, Row, Row Your Boat", notes: [
    C,C,C,D,E, E,D,E,F,G, C2,C2,C2,G,G,G,E,E,E,C,C,C, G,F,E,D,C ] },
  { icon: "🎵", name: "Ode to Joy", notes: [
    E,E,F,G,G,F,E,D,C,C,D,E,E,D,D,
    E,E,F,G,G,F,E,D,C,C,D,E,D,C,C ] },
];

let audio = null;
let song = SONGS[1];
let pos = 0;

// ---------- Sound: a soft, piano-like tone made with Web Audio ----------
function play(freq, length = 1.2, when = 0) {
  if (!audio) return;
  const t = audio.currentTime + when;
  const out = audio.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
  out.gain.exponentialRampToValueAtTime(0.0001, t + length);
  out.connect(audio.destination);
  // A fundamental plus two quieter overtones
  [[1, "triangle", 1], [2, "sine", 0.25], [3, "sine", 0.08]].forEach(([mult, type, vol]) => {
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type;
    osc.frequency.value = freq * mult;
    g.gain.value = vol;
    osc.connect(g).connect(out);
    osc.start(t);
    osc.stop(t + length + 0.05);
  });
}

// ---------- Build the screen ----------
const pianoEl = document.getElementById("piano");
const songsEl = document.getElementById("songs");
const progressEl = document.getElementById("progress");
const partyEl = document.getElementById("party");

const keyEls = KEYS.map((k, i) => {
  const el = document.createElement("div");
  el.className = "key";
  el.style.setProperty("--c", k.color);
  el.innerHTML = '<div class="blob"></div>';
  el.addEventListener("pointerdown", e => { e.preventDefault(); press(i, el); });
  pianoEl.appendChild(el);
  return el;
});

SONGS.forEach(s => {
  const b = document.createElement("button");
  b.className = "song";
  b.textContent = s.icon;
  b.title = s.name;
  b.addEventListener("pointerdown", e => { e.preventDefault(); pickSong(s, b); });
  s.button = b;
  songsEl.appendChild(b);
});

// Computer keyboard too: A S D F G H J K (and number keys 1-8)
const KEYMAP = "asdfghjk";
document.addEventListener("keydown", e => {
  if (e.repeat) return;
  let i = KEYMAP.indexOf(e.key.toLowerCase());
  if (i < 0 && e.key >= "1" && e.key <= "8") i = Number(e.key) - 1;
  if (i >= 0) press(i, keyEls[i]);
});

// ---------- Playing ----------
function press(i, el) {
  play(KEYS[i].freq);
  el.classList.add("pressed");
  setTimeout(() => el.classList.remove("pressed"), 150);

  if (!song.notes.length) { sparks(el, 3); return; }   // free play
  if (i !== song.notes[pos]) return;                    // other key: it still sounds, no scolding

  sparks(el, 6);
  pos++;
  if (pos >= song.notes.length) { finish(); return; }
  update();
}

function pickSong(s, button) {
  song = s;
  pos = 0;
  SONGS.forEach(x => x.button.classList.toggle("active", x === s));
  partyEl.classList.remove("show");
  buildDots();
  update();
  if (s.notes.length) preview();
}

// Play the first few notes so the child hears what's coming
function preview() {
  song.notes.slice(0, 4).forEach((n, k) => play(KEYS[n].freq, 0.6, k * 0.4));
}

function buildDots() {
  progressEl.innerHTML = "";
  song.notes.forEach(n => {
    const d = document.createElement("div");
    d.className = "dot";
    d.dataset.color = KEYS[n].color;
    progressEl.appendChild(d);
  });
}

function update() {
  const playing = song.notes.length > 0;
  document.body.classList.toggle("song-mode", playing);
  const target = playing ? song.notes[pos] : -1;
  keyEls.forEach((el, i) => el.classList.toggle("target", i === target));
  [...progressEl.children].forEach((d, k) => {
    d.classList.toggle("done", k < pos);
    d.classList.toggle("next", k === pos);
    d.style.background = k <= pos ? d.dataset.color : "";
  });
}

function finish() {
  document.body.classList.remove("song-mode");
  keyEls.forEach(el => el.classList.remove("target"));
  [...progressEl.children].forEach(d => { d.style.background = d.dataset.color; d.classList.remove("next"); });
  partyEl.classList.add("show");
  // Happy run up the keys
  [0, 2, 4, 7, 4, 7].forEach((n, k) => play(KEYS[n].freq, 0.5, k * 0.12));
  keyEls.forEach((el, k) => setTimeout(() => sparks(el, 8, ["🎉", "🎊", "⭐", "🌈"]), k * 80));
  // Then start the same song again
  setTimeout(() => { partyEl.classList.remove("show"); pos = 0; update(); }, 3000);
}

function sparks(el, count, icons = ["⭐", "✨", "💖", "🌟"]) {
  const r = el.getBoundingClientRect();
  for (let k = 0; k < count; k++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.left = r.left + r.width / 2 + "px";
    s.style.top = r.top + r.height * 0.6 + "px";
    s.style.setProperty("--dx", (Math.random() * 240 - 120) + "px");
    s.style.setProperty("--dy", (-Math.random() * 260 - 60) + "px");
    s.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}

// ---------- Start: one tap unlocks sound ----------
document.getElementById("start").addEventListener("pointerdown", e => {
  e.preventDefault();
  audio = new (window.AudioContext || window.webkitAudioContext)();
  e.currentTarget.remove();
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  pickSong(song, song.button);
});

pickSong(song, song.button);
</script>
</body>
</html>
